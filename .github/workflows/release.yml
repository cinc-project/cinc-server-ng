name: release

# Publish a multi-arch container image when a GitHub Release is published.
# The image goes to GHCR under the repository owner: ghcr.io/<owner>/cinc-zero.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write # push the image to GHCR with GITHUB_TOKEN
  id-token: write # OIDC token for keyless Sigstore signing of the provenance
  attestations: write # record the signed attestation in GitHub's store

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU + buildx give us the cross-build (arm64) and OCI features.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Go Dockerfile stamps version metadata in via build args.
      - name: Capture build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      # Derive image tags from the release: the semver (e.g. 0.2.0), the major.minor
      # (0.2), and latest. The leading "v" on the git tag is stripped automatically.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cinc-zero
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit attestations attached to the image index: a full provenance
          # record (mode=max) and an SPDX SBOM, inspectable with
          # `docker buildx imagetools inspect --format '{{json .SBOM}}' <ref>`.
          provenance: mode=max
          sbom: true

      # A second, Sigstore-signed SLSA provenance attestation recorded in GitHub's
      # transparency log and pushed alongside the image. Verify with:
      #   gh attestation verify oci://ghcr.io/<owner>/cinc-zero:<tag> --owner <owner>
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cinc-zero
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
