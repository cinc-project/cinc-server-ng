name: Benchmark vs Chef Infra Server

# Like-for-like benchmarks, all on one runner.
#
# The servers job measures Chef Infra Server (the FOSS Cinc Server build),
# chef-zero, and cinc-server-ng (SQLite and in memory, each over HTTP and
# HTTPS, and without auth) with the
# same load generator, the same seeded data and, where a server verifies
# signatures, the same signing identity. Only one server is up while it is
# measured, so none competes with another for the runner's cores; each is
# measured several times in a rotating order and every cell of the report is
# the median. Memory is sampled for every run (PSS across the server's whole
# process tree), idle and under load. See scripts/compare-servers.sh.
#
# The go-bench job runs cinc-server-ng's Go benchmarks for the latest release
# and for this commit on the same VM, interleaved, and compares them with
# benchstat: the only like-for-like way to compare two versions, since Chef
# has no equivalent of these benchmarks.
#
# Read the caveats in the summary before quoting a number.

on:
  # A workflow_dispatch workflow is only dispatchable once it is on the default
  # branch, so changes to the harness are validated by running it — scoped to
  # the harness alone, since a full Chef Infra Server install is not something
  # to put on every pull request.
  pull_request:
    paths:
      - .github/workflows/benchmark-vs-chef-server.yml
      - cmd/loadtest/**
      - cmd/benchreport/**
      - scripts/compare-servers.sh
      - scripts/memsample.sh
  workflow_dispatch:
    inputs:
      seed:
        description: "nodes to seed into each server"
        default: "500"
      conc:
        description: "concurrency for the QPS phase"
        default: "10"
      warm:
        description: "sequential samples per operation for p50/p95/QPS@1"
        default: "1000"
      reps:
        description: "times each server is measured; the report takes medians"
        default: "3"
      base_ref:
        description: "release to compare the Go benchmarks against (default: latest tag)"
        default: ""

permissions:
  contents: read

jobs:
  servers:
    name: Chef Infra Server, chef-zero and cinc-server-ng
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORG: bench
      BENCH_USER: benchuser
      SEED: ${{ inputs.seed || '500' }}
      CONC: ${{ inputs.conc || '10' }}
      WARM: ${{ inputs.warm || '1000' }}
      REPS: ${{ inputs.reps || '3' }}
      CHEF_ZERO_VERSION: 15.1.11
    steps:
      - name: Validate inputs
        run: |
          # These come from whoever dispatched the run. They are only ever used
          # quoted, but a benchmark parameter has no business being anything
          # other than a number, so reject the rest rather than reason about it.
          for pair in "seed:$SEED" "conc:$CONC" "warm:$WARM" "reps:$REPS"; do
            name=${pair%%:*}; value=${pair#*:}
            case "$value" in
              ''|*[!0-9]*) echo "$name must be a positive integer, got: $value" >&2; exit 1;;
            esac
          done
          echo "seed=$SEED conc=$CONC warm=$WARM reps=$REPS"

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the harness and the server
        run: |
          # Built once, up front, so no measurement includes a compile.
          mkdir -p /tmp/bin
          go build -o /tmp/bin/cinc-server-ng ./cmd/cinc-server-ng
          go build -o /tmp/bin/loadtest ./cmd/loadtest
          go build -o /tmp/bin/benchreport ./cmd/benchreport

      - name: Install chef-zero
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby ruby-dev build-essential
          sudo gem install --no-document chef-zero -v "$CHEF_ZERO_VERSION"
          chef-zero --version

      - name: Install Cinc Server
        run: |
          set -euo pipefail
          curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-server -c stable
          sudo mkdir -p /etc/cinc-project
          printf "api_fqdn '%s'\n" "$(hostname -f)" | sudo tee /etc/cinc-project/cinc-server.rb
          sudo cinc-server-ctl reconfigure --chef-license=accept

      - name: Point the API name at loopback
        run: echo "127.0.0.1 $(hostname -f)" | sudo tee -a /etc/hosts

      - name: Wait for the API to be ready
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsSk https://localhost/_status | grep -q '"status":"pong"'; then exit 0; fi
            sleep 5
          done
          sudo cinc-server-ctl status || true
          exit 1

      - name: Provision the org and the shared identity
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/bench
          sudo cinc-server-ctl user-create "$BENCH_USER" Bench User bench@example.com "$(openssl rand -hex 16)" \
            --filename /tmp/bench/user.pem
          sudo cinc-server-ctl org-create "$ORG" "Benchmark" --association_user "$BENCH_USER" \
            --filename /tmp/bench/validator.pem
          sudo chown -R "$(id -u):$(id -g)" /tmp/bench
          openssl rsa -in /tmp/bench/user.pem -pubout -out /tmp/bench/user.pub
          openssl s_client -showcerts -connect localhost:443 -servername "$(hostname -f)" </dev/null 2>/dev/null \
            | openssl x509 -outform PEM > /tmp/bench/ca.pem
          echo "REF_URL=https://$(hostname -f)/organizations/$ORG" >> "$GITHUB_ENV"

      - name: Give cinc-server-ng the same identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/state/users "/tmp/state/organizations/$ORG/groups"
          PUBKEY=$(python3 -c 'import json,sys; print(json.dumps(open(sys.argv[1]).read()))' /tmp/bench/user.pub)
          cat > "/tmp/state/users/$BENCH_USER.json" <<EOF
          {"username":"$BENCH_USER","display_name":"Bench User","email":"bench@example.com","public_key":$PUBKEY}
          EOF
          echo "[\"$BENCH_USER\"]" > "/tmp/state/organizations/$ORG/members.json"
          cat > "/tmp/state/organizations/$ORG/groups/admins.json" <<EOF
          {"groupname":"admins","users":["$BENCH_USER"],"clients":[],"groups":[]}
          EOF

      - name: Run the comparison
        env:
          BIN: /tmp/bin
          OUT: /tmp/results
          USER_KEY: /tmp/bench/user.pem
          STATE_DIR: /tmp/state
          CACERT: /tmp/bench/ca.pem
        run: scripts/compare-servers.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## Like-for-like: Chef Infra Server, chef-zero and cinc-server-ng"
            echo
            echo "Host: \`$(uname -msr)\`, $(nproc) cores, $(awk '/MemTotal/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo) · Go $(go version | awk '{print $3}') · Cinc Server $(sudo cat /opt/cinc-project/version-manifest.txt 2>/dev/null | awk 'NR==1 {print $2}') · chef-zero $CHEF_ZERO_VERSION"
            echo
            echo "Params: seed=$SEED conc=$CONC warm=$WARM · each server measured $REPS times, one at a time, in rotating order; every cell is the median."
            echo
            /tmp/bin/benchreport -runs '/tmp/results/run-*.json' -mem '/tmp/results/mem-*.json' 2>&1 || echo "(no results)"
            echo "### Reading these honestly"
            echo
            echo "- **Durable against durable:** compare cinc-server-ng (SQLite, HTTPS) with Chef Infra Server. Both persist every write and both serve TLS."
            echo "- **Unsigned against unsigned:** compare cinc-server-ng (no auth) with chef-zero, which does not verify signatures."
            echo "- Chef Infra Server is measured as it ships, nginx included, over HTTPS. cinc-server-ng is measured over both: the HTTPS rows serve TLS natively with a self-signed P-256 certificate; the others, chef-zero included, are plain HTTP."
            echo "- Chef Infra Server persists its data between repetitions, so its later runs update existing nodes where the others create them."
            echo "- Memory is PSS summed over each server's whole process tree: for Chef Infra Server that is erchef, PostgreSQL, OpenSearch, bifrost, bookshelf, nginx and redis."
            echo "- Chef Infra Server implements a great deal that cinc-server-ng does not. This measures what each gives you on one machine, not Chef Infra Server on hardware sized for it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: servers-results
          path: /tmp/results
          if-no-files-found: ignore

  go-bench:
    name: Go benchmarks, latest release vs this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_REF: ${{ inputs.base_ref }}
      # The fleet, search-scale, registration and store benchmarks: the ones
      # that decide how cinc-server-ng behaves as a fleet grows.
      BENCH: '^Benchmark(FleetCheckin|SearchScale|Bootstrap|Checkins|ListObjects|SearchScanWarm|Get$|Put$)'
      PKGS: ./server/ ./internal/api/ ./internal/store/sqlite/
      # The write-latency benchmarks run one fixed workload regardless of b.N
      # and report its distribution, so each sample must be exactly one run
      # (-benchtime 1x). At the default benchtime the framework's ramp-up calls
      # them a varying number of times against fresh databases, and samples
      # from different ramp-ups are not comparable.
      LATENCY_BENCH: '^BenchmarkWriteLatency'
      LATENCY_PKG: ./internal/store/sqlite/
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Choose the baseline
        run: |
          set -euo pipefail
          base=${BASE_REF:-$(git tag --sort=-v:refname | head -1)}
          case "$base" in
            ''|-*|*[!A-Za-z0-9._/-]*) echo "unusable base ref: $base" >&2; exit 1;;
          esac
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null || { echo "no such ref: $base" >&2; exit 1; }
          git worktree add --detach /tmp/base "$base"
          echo "BASE=$base" >> "$GITHUB_ENV"

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e

      - name: Benchmark, interleaved
        run: |
          set -euo pipefail
          read -r -a pkgs <<<"$PKGS"
          # Alternate base and head so drift on the shared VM lands on both.
          # Benchmarks that exist on only one side are left out by benchstat.
          for round in 1 2; do
            echo "::group::round $round: $BASE"
            (cd /tmp/base && go test -run '^$' -bench "$BENCH" -benchmem -count 3 -timeout 30m "${pkgs[@]}") | tee -a /tmp/base.txt
            (cd /tmp/base && go test -run '^$' -bench "$LATENCY_BENCH" -benchtime 1x -count 3 -timeout 10m "$LATENCY_PKG") | tee -a /tmp/base.txt
            echo "::endgroup::"
            echo "::group::round $round: HEAD"
            go test -run '^$' -bench "$BENCH" -benchmem -count 3 -timeout 30m "${pkgs[@]}" | tee -a /tmp/head.txt
            go test -run '^$' -bench "$LATENCY_BENCH" -benchtime 1x -count 3 -timeout 10m "$LATENCY_PKG" | tee -a /tmp/head.txt
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Go benchmarks: $BASE vs $(git rev-parse --short HEAD)"
            echo
            echo "Host: \`$(uname -msr)\`, $(nproc) cores · Go $(go version | awk '{print $3}') · both sides run on this VM, interleaved, n=6 each."
            echo
            echo '```'
            "$(go env GOPATH)/bin/benchstat" "$BASE=/tmp/base.txt" "HEAD=/tmp/head.txt" 2>&1 || echo "(benchstat failed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-bench-results
          path: |
            /tmp/base.txt
            /tmp/head.txt
          if-no-files-found: ignore
