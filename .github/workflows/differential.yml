name: Differential

# Compares cinc-zero's API responses against a real Chef Infra Server (the FOSS
# Cinc Server distribution) by issuing the same requests to both and diffing
# what comes back.
#
# Every other suite checks cinc-zero against its own idea of correct. This is
# the only thing that checks it against the real implementation, so it is the
# only thing that can find a response we have confidently got wrong.
#
# It installs and reconfigures a full Chef Infra Server, which takes several
# minutes and a lot of the runner, so it does not run per-PR.
#
# Earlier runs could not reach the reference server's API: every path except
# /_status returned nginx's static landing page. Part of that investigation was
# looking in the wrong place — Cinc Server installs under /etc/cinc-project,
# /var/opt/cinc-project and /opt/cinc-project, not the /etc/opscode and
# /var/opt/opscode paths Chef Infra Server uses. Configuration written to the
# opscode path was simply ignored, so "pinning api_fqdn changed nothing" was
# never actually a test of that.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC

permissions:
  contents: read

jobs:
  differential:
    name: cinc-zero vs Chef Infra Server
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORG: diffs
      DIFF_USER: diffuser
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Cinc Server
        run: |
          curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-server -c stable
          # Cinc Server reads its configuration from /etc/cinc-project, not the
          # /etc/opscode path Chef Infra Server uses. Show what the package laid
          # down before adding to it, so a future change of layout is visible
          # rather than silently ignored.
          echo "=== /etc/cinc-project after install ==="
          sudo ls -la /etc/cinc-project || true
          # Pin api_fqdn rather than leaving it to auto-detection: the public API
          # is only routed for requests addressed to it.
          sudo mkdir -p /etc/cinc-project
          printf "api_fqdn '%s'\n" "$(hostname -f)" | sudo tee /etc/cinc-project/cinc-server.rb
          sudo cinc-server-ctl reconfigure --chef-license=accept
          sudo cinc-server-ctl status

      - name: Wait for the API to be ready
        run: |
          set -euo pipefail
          # reconfigure returns before erchef is actually serving, so
          # provisioning immediately after it gets a 404 from nginx. Poll the
          # status endpoint instead of guessing at a sleep. (-k here only
          # because the CA has not been exported yet; the comparison itself
          # pins it.)
          for _ in $(seq 1 60); do
            if curl -fsSk https://localhost/_status | grep -q '"status":"pong"'; then
              echo "API ready"
              exit 0
            fi
            sleep 5
          done
          echo "the server never became ready:"
          sudo cinc-server-ctl status || true
          curl -sSk https://localhost/_status || true
          exit 1

      - name: Provision the org and the shared identity
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/diff
          # One identity, valid on both servers: a response may name the actor
          # that created an object, so comparing across two users would report a
          # difference on every ACL.
          sudo cinc-server-ctl user-create "$DIFF_USER" Diff User diff@example.com "$(openssl rand -hex 16)" \
            --filename /tmp/diff/user.pem
          sudo cinc-server-ctl org-create "$ORG" "Differential" --association_user "$DIFF_USER" \
            --filename /tmp/diff/validator.pem
          # The ctl commands run as root, so hand the directory back before
          # writing to it as the runner user.
          sudo chown -R "$(id -u):$(id -g)" /tmp/diff
          chmod -R u+rw /tmp/diff
          openssl rsa -in /tmp/diff/user.pem -pubout -out /tmp/diff/user.pub

      - name: Export the reference server's CA
        run: |
          set -euo pipefail
          # Pinned rather than skipping verification: comparing responses is
          # pointless if they could have come from anywhere.
          openssl s_client -showcerts -connect localhost:443 -servername "$(hostname -f)" </dev/null 2>/dev/null \
            | openssl x509 -outform PEM > /tmp/diff/ca.pem
          test -s /tmp/diff/ca.pem
          # The certificate is issued for the host's FQDN, so the comparison has
          # to address the server by that name for verification to succeed.
          echo "DIFF_REFERENCE_URL=https://$(hostname -f)/organizations/$ORG" >> "$GITHUB_ENV"

      - name: Seed cinc-zero with the same identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/state/users "/tmp/state/organizations/$ORG/groups"
          PUBKEY=$(python3 -c 'import json,sys; print(json.dumps(open(sys.argv[1]).read()))' /tmp/diff/user.pub)
          cat > /tmp/state/users/$DIFF_USER.json <<EOF
          {"username":"$DIFF_USER","display_name":"Diff User","email":"diff@example.com","public_key":$PUBKEY}
          EOF
          echo "[\"$DIFF_USER\"]" > "/tmp/state/organizations/$ORG/members.json"
          # An org admin, matching what --association_user grants on the
          # reference server.
          cat > "/tmp/state/organizations/$ORG/groups/admins.json" <<EOF
          {"groupname":"admins","users":["$DIFF_USER"],"clients":[],"groups":[]}
          EOF

      - name: Start cinc-zero
        run: |
          set -euo pipefail
          go build -o /tmp/cinc-zero ./cmd/cinc-zero
          /tmp/cinc-zero --addr 127.0.0.1:8889 --orgs "$ORG" --state /tmp/state >/tmp/cinc-zero.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8889/_status >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "cinc-zero did not become ready:"; cat /tmp/cinc-zero.log; exit 1

      - name: Probe the reference API routing
        shell: bash +e {0}
        run: |
          FQDN=$(hostname -f)
          echo "=== resolved api_fqdn and nginx settings ==="
          sudo cinc-server-ctl show-config 2>/dev/null | grep -iE '"(api_fqdn|server_name|ssl_port|non_ssl_port|url)"' | head -20
          echo
          echo "=== nginx config tree ==="
          sudo ls /var/opt/cinc-project 2>&1 | head
          sudo find /var/opt/cinc-project/nginx -name '*.conf' 2>/dev/null | head -20
          echo
          echo "=== nginx.conf (structure preserved: which location sits in which server) ==="
          sudo cat -n /var/opt/cinc-project/nginx/etc/nginx.conf | sed -n '1,200p'
          echo
          echo "=== chef_https_lb.conf: the catch-all location and after ==="
          sudo sed -n '150,300p' /var/opt/cinc-project/nginx/etc/chef_https_lb.conf | cat -n
          echo
          echo "=== routing lua ==="
          sudo find /var/opt/cinc-project/nginx /opt/cinc-project/embedded/conf -name '*.lua' 2>/dev/null | head
          echo
          echo "=== what nginx logged for a real API request ==="
          curl -sSk -o /dev/null "https://$FQDN/organizations/$ORG/nodes"
          sudo tail -5 /var/log/cinc-project/nginx/access.log 2>/dev/null
          echo "--- error log ---"
          sudo tail -20 /var/log/cinc-project/nginx/error.log 2>/dev/null
          echo
          echo "=== path probes ==="
          for target in "/_status" "/organizations" "/organizations/$ORG" "/organizations/$ORG/nodes" "/users" "/authenticate_user"; do
            code=$(curl -sSk -o /tmp/probe.out -w '%{http_code}' "https://$FQDN$target")
            printf '%-40s -> %s  %s\n' "$target" "$code" "$(head -c 90 /tmp/probe.out | tr -d '\n')"
          done
          echo
          echo "=== orgs ==="
          sudo cinc-server-ctl org-list
          echo "=== exit 0 regardless; this step is diagnostic ==="
          exit 0

      - name: Compare
        env:
          # DIFF_REFERENCE_URL comes from the CA step, which knows the name the
          # certificate is valid for.
          DIFF_CANDIDATE_URL: http://127.0.0.1:8889/organizations/diffs
          DIFF_KEY: /tmp/diff/user.pem
          DIFF_REFERENCE_CA: /tmp/diff/ca.pem
        run: go test -tags differential ./differential/ -v -timeout 30m

      - name: cinc-zero log
        if: always()
        run: cat /tmp/cinc-zero.log || true
